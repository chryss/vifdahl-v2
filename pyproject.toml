[project]
authors = [{name = "Chris Waigl", email = "cwaigl@alaska.edu"}]
dependencies = []
name = "vifdahl"
description = "VIIRS I-band Fire Detection Algorithm for High Latitudes"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/vifdahl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
vifdahl = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"

[tool.pixi.dependencies]
xarray = ">=2026.9.0,<2027"
geopandas = ">=1.2.0,<2"
earthaccess = ">=0.19.0,<0.20"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"
h5netcdf = ">=1.8.1,<2"
h5py = ">=3.16.0,<4"
pyproj = ">=3.8.0,<4"
shapely = ">=2.2.0,<3"
pytest = ">=9.1.1,<10"
cartopy = ">=0.26.0,<0.27"
matplotlib = ">=3.11.2,<4"
scipy = ">=1.18.1,<2"
joblib = ">=1.6.0,<2"
pyarrow = ">=25.0.0,<26"
